name: BridgeCF CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile C++ graph engine
        run: make -C backend
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Ruff
        run: ruff check backend
      - name: Pytest
        run: pytest -v backend/tests
      - name: Validate extension JavaScript
        run: node --check extension/background.js extension/content.js extension/popup.js
      - name: Offline evaluation
        run: PYTHONPATH=backend python -m evals.run_evals --mode offline

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build Docker image
        run: docker build --file backend/Dockerfile --tag bridgecf:ci .
