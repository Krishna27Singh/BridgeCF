<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BridgeCF</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; }
      body { width: 340px; margin: 0; padding: 16px; background: #111827; color: #f9fafb; }
      h1 { margin: 0 0 14px; font-size: 18px; }
      label { display: block; margin-top: 10px; font-size: 12px; color: #cbd5e1; }
      input { box-sizing: border-box; width: 100%; margin-top: 5px; padding: 9px; border: 1px solid #475569; border-radius: 6px; background: #1e293b; color: white; }
      .actions { display: flex; gap: 8px; margin-top: 14px; }
      button { flex: 1; border: 0; border-radius: 6px; padding: 9px; background: #2563eb; color: white; cursor: pointer; }
      #testConnection { background: #334155; }
      #status { min-height: 18px; margin-top: 10px; color: #93c5fd; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>BridgeCF Settings</h1>
    <label>Codeforces handle
      <input id="userHandle" type="text" placeholder="tourist">
    </label>
    <label>API base URL
      <input id="apiBaseUrl" type="url" placeholder="http://127.0.0.1:8000">
    </label>
    <div class="actions">
      <button id="save" type="button">Save</button>
      <button id="testConnection" type="button">Test Connection</button>
    </div>
    <div id="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
