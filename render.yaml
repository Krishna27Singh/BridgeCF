services:
  - type: web
    name: bridgecf-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /app/backend/data
      - key: CORS_ORIGINS
        value: https://codeforces.com
      - key: LLM_PROVIDER
        value: openai_compat
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-20b
      - key: OPENAI_API_KEY
        sync: false
      - key: INDEX_ARCHIVE_URL
        value: https://github.com/Krishna27Singh/BridgeCF/releases/download/index-latest/bridgecf-index.tar.gz
