services:
  - type: web
    name: bridgecf-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATA_DIR
        value: /app/backend/data
      - key: CORS_ORIGINS
        value: https://codeforces.com
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: BOOTSTRAP_LIMIT
        value: "3000"
